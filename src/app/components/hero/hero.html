<section id="hero"
         class="relative flex min-h-screen items-center border-b border-black/10">

  <div
       class="mx-auto grid w-full max-w-[1440px] gap-12 px-6 pb-20 pt-28 lg:grid-cols-12 lg:px-10 lg:pt-32">

    <!-- Left -->

    <div class="flex flex-col justify-center lg:col-span-7">

      <div
           class="mb-6 font-mono text-[11px] uppercase tracking-widest text-black/45">

        01 / 10

      </div>

      <h1
          class="max-w-5xl text-[clamp(3.5rem,8vw,8rem)] font-bold leading-[0.88] tracking-[-0.07em]">

        WEB & MOBILE

        <span class="block text-[#0063d4]">

          DEVELOPER

        </span>

      </h1>

      <p
         class="mt-8 max-w-xl text-xl font-medium leading-relaxed text-black/75 lg:text-2xl">

        I build digital products

        from idea to production.

      </p>

      <!-- Stats -->

      <div class="mt-10 flex flex-wrap gap-8">

        <div>

          <p class="text-xl font-bold">TECH LEAD</p>

          <p class="mt-1 text-xs text-black/45">

            ROLE

          </p>

        </div>

        <div class="border-l border-black/15 pl-8">

          <p class="text-xl font-bold">WEB · MOBILE</p>

          <p class="mt-1 text-xs text-black/45">

            PLATFORMS

          </p>

        </div>

        <div class="border-l border-black/15 pl-8">

          <p class="text-xl font-bold">PRODUCT</p>

          <p class="mt-1 text-xs text-black/45">

            MINDSET

          </p>

        </div>

      </div>

      <!-- CTA -->

      <div class="mt-10 flex flex-wrap gap-3">

        <a href="#work"
           class="inline-flex items-center gap-3 bg-[#0063d4] px-6 py-3 text-sm font-medium text-white transition hover:bg-black">

          View My Work

          <span>→</span>

        </a>

        <a href="#contact"
           class="inline-flex items-center gap-3 border border-black/20 px-6 py-3 text-sm font-medium transition hover:border-black hover:bg-black hover:text-white">

          Let's Talk

          <span>→</span>

        </a>

      </div>

    </div>

    <!-- Right -->

    <div class="flex items-center lg:col-span-5">

      <div class="relative aspect-4/3 w-full overflow-hidden bg-black">

        <img src="assets/images/hero.jpeg"
             alt="Nam Nguyen workspace"
             class="h-full w-full object-cover transition duration-700 hover:scale-105" />

        <!-- Tech floating card -->

        <div
             class="absolute right-4 top-4 grid grid-cols-2 gap-2 border border-white/30 bg-white/90 p-4 backdrop-blur">
          @for (tool of badgeTools; track tool.name) {
          <span class="text-[10px] font-semibold">

            {{ tool.name }}

          </span>
          }

        </div>

      </div>

    </div>

  </div>

  <a href="#work"
     class="absolute bottom-8 right-8 hidden items-center gap-3 text-[10px] font-medium uppercase tracking-widest text-black/50 lg:flex">

    Scroll to explore

    <span class="text-lg">↓</span>

  </a>

</section>

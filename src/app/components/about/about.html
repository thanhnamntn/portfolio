<section class="section" id="about">
  <div class="container">
    <div class="section-shell">
      <div class="section-eyebrow" appScrollReveal>
        <span class="eyebrow-index">07 / 09</span>
        <span class="eyebrow-label">About</span>
      </div>

      <div class="about-content">
        <h2 appScrollReveal>
          I'm {{ callName }} — a {{ data.title }}<br>
          who enjoys turning complex problems into simple products.
        </h2>

        <div class="about-grid" appScrollReveal>
          <p class="about-text">{{ data.about }}</p>

          <!-- TODO: swap for a real photo -->
          <div class="about-photo">
            <div class="avatar-ring">
              <span class="avatar-initials gradient-text">NN</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<header
        class="fixed left-0 top-0 z-50 w-full border-b border-black/10 bg-[#f5f5f2]/85 backdrop-blur-md">
  <div
       class="mx-auto flex h-16 max-w-[1440px] items-center justify-between px-6 lg:px-10">
    <a href="#"
       class="text-sm font-bold tracking-tight">
      NGUYEN THANH NAM
    </a>
    <nav class="hidden items-center gap-8 md:flex">
      @for (item of links; track item.label) {
      <a class="text-xs font-medium text-black/60 transition hover:text-black">
        {{ item.label }}
      </a>
      }
    </nav>
    <!-- Mobile -->
    <button class="text-xs font-medium md:hidden">
      MENU
    </button>
  </div>
</header>

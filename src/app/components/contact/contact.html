<section class="section contact-section" id="contact">
  <div class="container">
    <div class="cta-band">
      <div class="cta-left">
        <span class="section-eyebrow-inline">09 / 09 · Let's Build</span>
        <h2>Have an idea?</h2>
        <p>Let's turn it into something real.</p>
        <a [href]="'mailto:' + contact.email" class="btn-primary">
          Get in Touch
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>

      <div class="cta-right">
        <a [href]="'mailto:' + contact.email" class="cta-contact-row">{{ contact.email }}</a>
        @for (link of links; track link.label) {
          <a [href]="link.href" target="_blank" rel="noopener" class="cta-contact-row">{{ link.label }}</a>
        }
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <span>{{ name }}</span>
  <button class="scroll-top" (click)="scrollToTop()">
    Scroll to top
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>
</footer>
